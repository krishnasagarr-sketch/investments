{% extends "base.html" %}
{% block title %}Reset password — Fixed Deposit Manager{% endblock %}

{% block content %}
  <div class="card" style="max-width:380px; margin:40px auto 0;">
    <h2 style="font-size:18px; margin:0 0 16px;">Reset your password</h2>

    {% if invalid %}
      <div class="error-box">
        This reset link is invalid or has expired.
        <a href="{{ url_for('forgot_password_page') }}">Request a new one</a>.
      </div>
    {% else %}
      {% if error %}
        <div class="error-box">{{ error }}</div>
      {% endif %}
      <form method="POST">
        <div class="form-group">
          <label for="password">New password</label>
          <input type="password" id="password" name="password" minlength="8" required autofocus>
        </div>
        <div class="form-group">
          <label for="confirm_password">Confirm new password</label>
          <input type="password" id="confirm_password" name="confirm_password" minlength="8" required>
        </div>
        <button type="submit" class="btn" style="width:100%;">Set new password</button>
      </form>
    {% endif %}
  </div>
{% endblock %}
