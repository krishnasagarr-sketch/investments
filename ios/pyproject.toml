[tool.briefcase]
project_name = "FD Manager"
bundle = "com.fdmanager"
version = "1.0.0"
url = "https://github.com/krishnasagarr-sketch/investments"
author = "FD Manager"
author_email = "noreply@example.com"

[tool.briefcase.app.fdmanager]
formal_name = "FD Manager"
description = "Track fixed deposits, recurring deposits and investments."
license = "MIT"
# The real Flask app (app.py, templates/) lives at the repo root and is
# symlinked into src/fdmanager/ below it, so this stays the single source
# of truth — no separate iOS copy to keep in sync.
sources = ["src/fdmanager"]
requires = [
    "flask>=3.0.0",
    "openpyxl>=3.1.0",
]

[tool.briefcase.app.fdmanager.iOS]
requires = [
    "toga-iOS>=0.4.0",
    "std-nslog>=1.0.3",
    # MarkupSafe (a Jinja2/Flask dependency) has never published a universal
    # py3-none-any wheel, only platform-compiled ones — and Briefcase can't
    # build packages from source for iOS either, even pure-Python ones
    # (a documented Briefcase limitation). This is a wheel built locally
    # from MarkupSafe's own official source with its optional C speedup
    # extension deliberately made to fail to compile, so its setup.py falls
    # back to the pure-Python implementation it already ships — same code,
    # just without the extension. To rebuild for a newer MarkupSafe version:
    #   CC=/usr/bin/false pip wheel markupsafe==<version> --no-deps -w vendor
    "./vendor/markupsafe-3.0.3-py3-none-any.whl",
]
