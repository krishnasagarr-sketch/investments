name: Build iOS App

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "app.py"
      - "templates/**"
      - "ios/**"
      - ".github/workflows/build-ios.yml"

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Briefcase
        run: pip install briefcase

      - name: Create iOS Xcode project
        working-directory: ios
        run: briefcase create iOS --no-input

      - name: Build for iOS Simulator (unsigned — no Apple Developer account needed)
        working-directory: ios
        run: briefcase build iOS --no-input

      - name: Locate build output
        working-directory: ios
        run: find build -maxdepth 8 -iname "*.app" -print

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: FDManager-ios-simulator
          path: ios/build/**/*.app
          if-no-files-found: warn
